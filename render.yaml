services:
  - type: web
    name: taskmaster-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false # Set this securely in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will generate a strong secret automatically!
      - key: FRONTEND_URL
        value: "https://week-excercise.vercel.app" # allowed CORS origin (comma-separate for multiple)
